controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.05
      shoulder_pan_joint: {trajectory: 0.30, goal: 0.03}
      shoulder_lift_joint: {trajectory: 0.30, goal: 0.03}
      elbow_joint: {trajectory: 0.30, goal: 0.03}
      wrist_1_joint: {trajectory: 0.30, goal: 0.03}
      wrist_2_joint: {trajectory: 0.30, goal: 0.03}
      wrist_3_joint: {trajectory: 0.30, goal: 0.03}

gripper_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.5
      stopped_velocity_tolerance: 0.02
      robotiq_85_left_knuckle_joint: {trajectory: 0.25, goal: 0.03}
